<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142132"/>
      <stop offset="60%" stop-color="#1C2F46"/>
      <stop offset="100%" stop-color="#0F1824"/>
    </linearGradient>
    <linearGradient id="chassisOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F28C28"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#mGrad)"/>

  <!-- Technical Schematic Grid -->
  <g stroke="#ffffff" stroke-width="0.5" opacity="0.07">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <!-- Concentric Target Schematics -->
    <circle cx="400" cy="220" r="140" fill="none"/>
    <circle cx="400" cy="220" r="180" fill="none"/>
  </g>

  <!-- Equipment Silhouette / Model -->
  
  <g transform="translate(140, 140)">
    <!-- Main Body Chassis -->
    <rect x="100" y="80" width="280" height="120" rx="10" fill="url(#chassisOrange)"/>
    <!-- Cab -->
    <rect x="120" y="20" width="110" height="70" rx="6" fill="#0F172A" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="135" y="30" width="80" height="40" fill="#38BDF8" opacity="0.4"/>
    <!-- Front Hopper -->
    <polygon points="380,200 480,200 470,120 380,100" fill="#475569"/>
    <!-- Rear Screed & Compaction Bar -->
    <rect x="40" y="170" width="80" height="35" rx="4" fill="#CBD5E1"/>
    <!-- Crawler Tracks -->
    <rect x="90" y="195" width="280" height="45" rx="20" fill="#0B0F14" stroke="#64748B" stroke-width="5"/>
    <circle cx="130" cy="217" r="16" fill="#F28C28"/>
    <circle cx="190" cy="217" r="14" fill="#64748B"/>
    <circle cx="250" cy="217" r="14" fill="#64748B"/>
    <circle cx="310" cy="217" r="14" fill="#64748B"/>
    <circle cx="350" cy="217" r="16" fill="#F28C28"/>
  </g>


  <!-- Lower Spec Info Bar -->
  <rect x="0" y="420" width="800" height="80" fill="#0B131F" opacity="0.95"/>
  <rect x="0" y="416" width="800" height="4" fill="url(#chassisOrange)"/>
  <text x="40" y="452" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#F28C28" letter-spacing="2">HEAVY MACHINERY &amp; FLEET</text>
  <text x="40" y="480" font-family="'Montserrat', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Asphalt Road Paver</text>
  <rect x="580" y="445" width="180" height="32" rx="4" fill="#1E293B" stroke="#F28C28" stroke-width="1"/>
  <text x="670" y="466" font-family="'Inter', monospace" font-size="11" font-weight="600" fill="#F28C28" text-anchor="middle">CAPACITY: 300-600 TPH</text>
</svg>