  <text x="30" y="462" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#F28C28" letter-spacing="1.5">&#9906; JAMMU & KASHMIR</text>
  <text x="30" y="495" font-family="'Montserrat', sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Arterial Road & Drainage Development</text>
